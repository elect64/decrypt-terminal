<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECRYPT — Terminal Check-In Scanner</title>
  
  <!-- Open Source QR Code Scanner Library -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  
  <style>
    :root {
      --bg: #07220C;
      --surface: #000000;
      --text: #FFFFFF;
      --accent-green: #00FF66;
      --accent-yellow: #FFCC00;
      --accent-red: #FF3333;
      --border: #1A4D23;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    header {
      width: 100%;
      max-width: 500px;
      text-align: center;
      padding: 15px 0;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }

    header h1 {
      font-size: 1.5rem;
      letter-spacing: 4px;
    }

    header p {
      font-size: 0.75rem;
      color: #888;
      margin-top: 5px;
    }

    .scanner-card {
      width: 100%;
      max-width: 500px;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px;
      text-align: center;
    }

    #reader {
      width: 100%;
      border: 1px dashed var(--border);
      margin-bottom: 15px;
      overflow: hidden;
    }

    .status-badge {
      font-size: 0.8rem;
      letter-spacing: 2px;
      color: #888;
      margin-bottom: 15px;
    }

    /* Scan Result Cards */
    .result-box {
      display: none;
      padding: 20px;
      border: 1px solid var(--border);
      margin-top: 15px;
      text-align: left;
    }

    .result-box.success {
      display: block;
      border-color: var(--accent-green);
      background: rgba(0, 255, 102, 0.05);
    }

    .result-box.warning {
      display: block;
      border-color: var(--accent-yellow);
      background: rgba(255, 204, 0, 0.05);
    }

    .result-box.danger {
      display: block;
      border-color: var(--accent-red);
      background: rgba(255, 51, 51, 0.05);
    }

    .result-title {
      font-size: 1.2rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .result-box.success .result-title { color: var(--accent-green); }
    .result-box.warning .result-title { color: var(--accent-yellow); }
    .result-box.danger .result-title { color: var(--accent-red); }

    .result-meta {
      font-size: 0.85rem;
      line-height: 1.8;
      color: #CCC;
    }

    .result-meta strong {
      color: #888;
    }

    .btn-next {
      display: none;
      width: 100%;
      margin-top: 15px;
      padding: 15px;
      background: var(--text);
      color: var(--surface);
      border: none;
      font-family: inherit;
      font-weight: bold;
      font-size: 0.9rem;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .btn-next.show { display: block; }
  </style>
</head>
<body>

  <header>
    <h1>DECRYPT TERMINAL</h1>
    <p>LIVE ACCESS VERIFICATION & CHECK-IN</p>
  </header>

  <div class="scanner-card">
    <div id="reader"></div>
    <div class="status-badge" id="scanner-status">CAMERA READY — ALIGN QR CODE</div>

    <!-- Result Display -->
    <div id="result-box" class="result-box">
      <div id="res-title" class="result-title"></div>
      <div class="result-meta">
        <p><strong>NAME:</strong> <span id="res-name"></span></p>
        <p><strong>CODE:</strong> <span id="res-code"></span></p>
        <p><strong>TRACK:</strong> <span id="res-track"></span></p>
        <p><strong>TIME:</strong> <span id="res-time"></span></p>
      </div>
    </div>

    <button id="btn-reset" class="btn-next" onclick="resetScanner()">SCAN NEXT TICKET</button>
  </div>

  <script>
        // Paste your deployed Google Apps Script Web App URL here
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxHaKEYwhGGeiQv64h9JogJkrqGVNuin6vCTSjQteVv9BGzyj6ZpeVH9ZKq_Ar6CPn_/exec";

    let html5QrcodeScanner;
    let isProcessing = false;

    function initScanner() {
      html5QrcodeScanner = new Html5Qrcode("reader");
      
      const config = { 
        fps: 10, 
        qrbox: { width: 220, height: 220 },
        aspectRatio: 1.0
      };

      html5QrcodeScanner.start(
        { facingMode: "environment" }, // Prefers rear camera
        config,
        onScanSuccess
      ).catch(err => {
        document.getElementById('scanner-status').innerText = "CAMERA ACCESS DENIED OR UNAVAILABLE";
      });
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      // Pause scanner while verifying
      html5QrcodeScanner.pause();
      document.getElementById('scanner-status').innerText = "VERIFYING CODE WITH DATABASE...";

      try {
        // Query Google Sheets via GET request
        const response = await fetch(`${SCRIPT_URL}?action=checkin&code=${encodeURIComponent(decodedText)}`);
        const data = await response.json();

        displayResult(data, decodedText);

      } catch (error) {
        displayResult({ status: 'error', message: 'Network error or script timeout.' }, decodedText);
      }
    }

    function displayResult(data, scannedCode) {
      const box = document.getElementById('result-box');
      const title = document.getElementById('res-title');
      const name = document.getElementById('res-name');
      const code = document.getElementById('res-code');
      const track = document.getElementById('res-track');
      const time = document.getElementById('res-time');
      const btn = document.getElementById('btn-reset');

      box.className = 'result-box'; // Reset classes

      if (data.status === 'success') {
        box.classList.add('success');
        title.innerText = "✓ ACCESS GRANTED";
        name.innerText = data.name;
        code.innerText = data.code;
        track.innerText = data.track;
        time.innerText = data.time;
        document.getElementById('scanner-status').innerText = "CHECK-IN COMPLETE";

      } else if (data.status === 'already_checked_in') {
        box.classList.add('warning');
        title.innerText = "⚠ ALREADY CHECKED IN";
        name.innerText = data.name;
        code.innerText = data.code;
        track.innerText = data.track;
        time.innerText = `Previously at ${data.time}`;
        document.getElementById('scanner-status').innerText = "ATTENDEE WAS ALREADY CHECKED IN";

      } else if (data.status === 'not_found') {
        box.classList.add('danger');
        title.innerText = "✕ INVALID CODE";
        name.innerText = "NOT FOUND IN DATABASE";
        code.innerText = scannedCode;
        track.innerText = "N/A";
        time.innerText = "N/A";
        document.getElementById('scanner-status').innerText = "UNREGISTERED ACCESS CODE";

      } else {
        box.classList.add('danger');
        title.innerText = "✕ SYSTEM ERROR";
        name.innerText = data.message || "UNABLE TO VERIFY";
        code.innerText = scannedCode;
        track.innerText = "N/A";
        time.innerText = "N/A";
      }

      btn.classList.add('show');
    }

    function resetScanner() {
      document.getElementById('result-box').className = 'result-box';
      document.getElementById('btn-reset').classList.remove('show');
      document.getElementById('scanner-status').innerText = "CAMERA READY — ALIGN QR CODE";
      isProcessing = false;
      html5QrcodeScanner.resume();
    }

    // Start scanner on load
    window.addEventListener('DOMContentLoaded', initScanner);

  </script>
</body>
</html>
